seed: 1337

data:
  split_dir: data/crops_80.10.10_split
  image_size: 224
  countries: null
  allowed_labels: [D00, D10, D20, D40]
  cache_images: false

model:
  name: custom_cnn
  pretrained: false
  freeze_backbone: false

train:
  epochs: 10
  batch_size: 128
  num_workers: 12
  prefetch_factor: 4
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 5
  min_delta: 0.001

outputs:
  root_dir: outputs/customcnn
  checkpoints_dir: outputs/customcnn/checkpoints
  logs_dir: outputs/customcnn/logs
  figures_dir: outputs/customcnn/figures
  label_map_path: outputs/customcnn/label_map.json
  best_checkpoint_name: best.pt
  history_name: history.json